[project]
name = "market-microstructure"
version = "0.1.0"
description = "Real-time market microstructure platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "websockets>=13",
    "aiokafka>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
ml = [
    "lightgbm>=4",
    "pandas>=2",
    "mlflow>=2.20,<3",
    "trino>=0.330",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["producer", "ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "flink"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
