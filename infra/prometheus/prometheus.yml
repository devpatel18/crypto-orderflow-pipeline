global:
  scrape_interval: 10s

scrape_configs:
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: flink
    static_configs:
      - targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]

  # producer and API run on the host, not in compose
  - job_name: producer
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:8010"]
