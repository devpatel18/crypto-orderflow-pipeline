connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=market
iceberg.jdbc-catalog.connection-password=market
iceberg.jdbc-catalog.catalog-name=iceberg
iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse/
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
# Allow maintenance to reclaim recent snapshots/files (default min is 7d, which
# would no-op on this project's <2-day-old data). Streaming commits every 10s
# create thousands of tiny files, so we expire aggressively.
iceberg.expire-snapshots.min-retention=1h
iceberg.remove-orphan-files.min-retention=1h
