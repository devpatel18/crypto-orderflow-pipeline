# Single-node config. Mirrors the trinodb/trino:467 image default and adds an
# explicit per-node query memory cap. Mounting this file REPLACES the image
# default, so every required single-node property must be present here.
#
# Why this exists: jvm.config uses -XX:MaxRAMPercentage=80, so the heap is ~80%
# of the container's memory limit. With docker-compose mem_limit=4g the heap is
# ~3.2g. query.max-memory-per-node bounds a single query's user memory per node
# well under that, so a heavy gold scan fails with EXCEEDED_LOCAL_MEMORY_LIMIT
# instead of pushing the heap until the JVM is OOM-killed (exit 137).
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static
query.max-memory-per-node=1GB
